name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / native simulation and certificates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MUJOCO_GL: egl
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.13"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen --extra dev ruff check .

      - name: Verify preserved release checksums
        working-directory: outputs/releases/0.7.0
        run: sha256sum --check SHA256SUMS

      - name: Verify archived complete mission evidence
        # Recheck source archives, egress coordinates and custody consistency.
        # This validates existing reports; it does not rerun the five missions.
        run: >-
          uv run --frozen --extra dev swarmrescue rescue-evaluation
          --reports
          outputs/releases/0.7.0/validation/seed19-complete-native.json
          outputs/releases/0.7.0/validation/seed42-complete-native.json
          outputs/releases/0.7.0/validation/seed42-complete-arm.json
          outputs/releases/0.7.0/validation/seed7-complete-native.json
          outputs/releases/0.7.0/validation/seed42-distance-native.json
          --out outputs/ci/mission-evidence

      - name: Run regression suite
        # ARM/QEMU cases report skips when the optional toolchain is absent.
        # Native C conformance, physics, certificates and packaging still run.
        run: uv run --frozen --extra dev pytest --junitxml=outputs/ci/tests.xml -ra

      - name: Reproduce independent certificate evaluation
        run: >-
          uv run --frozen --extra dev swarmrescue certificate-evaluation
          --output-dir outputs/ci/certificate-evaluation

      - name: Check certificate evidence against frozen results
        run: |
          uv run --frozen --extra dev python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          output = Path("outputs/ci/certificate-evaluation")
          fresh = json.loads((output / "results.json").read_text())
          frozen = json.loads(Path("docs/research/lag-rescue/results.json").read_text())
          expected = {
              "candidate_cases": 288,
              "integer_exact_cases": 288,
              "integer_exact_mismatches": 0,
              "selected_complete_missions": 80,
              "exhaustive_scenario_schedule_replays": 5352,
              "all_selected_replays_completed_within_budgets": True,
          }
          for key, value in expected.items():
              assert fresh[key] == frozen[key] == value, (key, fresh[key], frozen[key])
          assert fresh["method_counts"] == frozen["method_counts"]
          assert fresh["kernel_graph_max_absolute_error"] < 1e-12
          assert all(
              replay["all_replays_completed"]
              for replay in fresh["complete_mission_replays"]
          )
          protocol_path = output / "protocol.json"
          protocol_digest = hashlib.sha256(protocol_path.read_bytes()).hexdigest()
          assert fresh["protocol_sha256"] == protocol_digest
          protocol = json.loads(protocol_path.read_text())
          for name, expected_digest in protocol["source_sha256"].items():
              digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert digest == expected_digest, name
          print("Verified 288 exact comparisons and 5,352 complete modeled replays.")
          PY

      - name: Upload test and certificate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-python312
          path: outputs/ci/
          if-no-files-found: warn
          retention-days: 14
