[project]
name = "swarmrescue"
version = "0.3.0"
description = "EMBER -- edge-native message-passing for Bellman-egress routing"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco>=3.2",
    "taichi>=1.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.0",
    "polars>=1.0",
    "hydra-core>=1.3",
    "imageio>=2.30",
    # The mp4 encoder imageio dispatches to.  Without it the demo silently
    # degrades to an animated GIF, which is 20x the size at a third the frame
    # rate -- fine as a fallback, not fine as the default deliverable.
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "rich>=13.0",
]

[project.scripts]
swarmrescue = "swarmrescue.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.90", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cascade", "hazard", "ember", "ember.routing", "eval", "mcu", "firmware", "firmware.replay", "firmware.runtime", "swarmrescue"]

[tool.setuptools.package-data]
firmware = ["*.c", "*.h"]
"firmware.replay" = ["*.c", "*.ld"]
"firmware.runtime" = ["*.c", "*.h", "*.ld"]
eval = ["frozen_protocol.json"]
swarmrescue = ["runtime-lock.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
