<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">SwarmRescue execution and verification workflow</title>
  <desc id="desc">Simulation runs from a damaged building through private robot beliefs and candidate assignment to local contact and escort. A separate declared-model study checks supplied scenarios and timing with a certificate and an independent graph solver.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1118" height="298" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="34" fill="#334155" font-size="14" font-weight="700" letter-spacing="1">SIMULATED MISSION</text>
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="30" y="52" width="230" height="78" rx="12"/>
      <rect x="308" y="52" width="230" height="78" rx="12"/>
      <rect x="586" y="52" width="230" height="78" rx="12"/>
      <rect x="864" y="52" width="226" height="78" rx="12"/>
    </g>
    <g fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">
      <text x="145" y="83">Damaged building</text>
      <text x="423" y="83">Private robot beliefs</text>
      <text x="701" y="83">Candidate assignment</text>
      <text x="977" y="83">Contact and escort</text>
    </g>
    <g fill="#475569" font-size="13" text-anchor="middle">
      <text x="145" y="107">MuJoCo physics and live hazards</text>
      <text x="423" y="107">Local sensing and range evidence</text>
      <text x="701" y="107">Frozen-field preflight; host matching</text>
      <text x="977" y="107">Physical egress to outdoor zones</text>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M270 91H294"/>
      <path d="M548 91H572"/>
      <path d="M826 91H850"/>
    </g>
    <line x1="30" y1="151" x2="1090" y2="151" stroke="#cbd5e1"/>
    <text x="30" y="181" fill="#0f766e" font-size="14" font-weight="700" letter-spacing="1">DECLARED-MODEL VERIFICATION</text>
    <g fill="#f0fdfa" stroke="#99c9c1">
      <rect x="30" y="198" width="320" height="70" rx="12"/>
      <rect x="400" y="198" width="320" height="70" rx="12"/>
      <rect x="770" y="198" width="320" height="70" rx="12"/>
    </g>
    <g fill="#134e4a" font-size="17" font-weight="700" text-anchor="middle">
      <text x="190" y="226">Scenarios and timing intervals</text>
      <text x="560" y="226">Complete-rescue certificate</text>
      <text x="930" y="226">Independent graph oracle</text>
    </g>
    <g fill="#475569" font-size="13" text-anchor="middle">
      <text x="190" y="249">Robot approach + survivor wait + escort</text>
      <text x="560" y="249">Worst-case bounds and timing witnesses</text>
      <text x="930" y="249">NetworkX DAG + exact integer checks</text>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M360 233H386"/>
      <path d="M730 233H756"/>
    </g>
  </g>
</svg>
